name: Validate Demo Dependencies

on:
  push:
    branches: [main, dev, 'feature/**']
    paths:
      - 'commands/docs/demo.md'
      - 'tests/fixtures/dependency-spec.md'
      - 'tests/test_dependency_management.sh'
      - 'tests/test_integration_dependency_system.py'
      - 'scripts/demo-*'
      - 'scripts/dependency-manager.sh'
      - '.github/workflows/validate-dependencies.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'commands/docs/demo.md'
      - 'tests/fixtures/dependency-spec.md'
      - 'tests/test_dependency_management.sh'
      - 'tests/test_integration_dependency_system.py'
      - 'scripts/demo-*'
      - 'scripts/dependency-manager.sh'
      - '.github/workflows/validate-dependencies.yml'
  workflow_dispatch:

jobs:
  validate-dependencies:
    name: Check Dependency Interface (test spec)
    runs-on: ubuntu-latest
    env:
      # Exercise the retained interface; these are not production demo requirements.
      CRAFT_DEMO_SPEC: ${{ github.workspace }}/tests/fixtures/dependency-spec.md

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependency parser
        run: python -m pip install PyYAML

      - name: Run dependency interface tests
        run: bash tests/test_dependency_management.sh

      - name: Check available-tool test method
        id: check-asciinema
        continue-on-error: true
        run: |
          # Run dependency check with JSON output
          ./scripts/dependency-manager.sh display_status_json asciinema > deps-asciinema.json 2>&1 || true

          # Extract status (default to "ok" if file empty or malformed)
          if [ -f deps-asciinema.json ] && [ -s deps-asciinema.json ]; then
            status=$(jq -r '.status // "unknown"' deps-asciinema.json 2>/dev/null || echo "unknown")
          else
            status="unknown"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # Display results
          if [ -f deps-asciinema.json ] && [ -s deps-asciinema.json ]; then
            echo "### asciinema Dependencies"
            cat deps-asciinema.json | jq '.' || cat deps-asciinema.json
          else
            echo "Warning: Could not generate asciinema dependency report"
            status="issues"
            echo "status=$status" >> "$GITHUB_OUTPUT"
          fi

          # Fail if issues detected
          if [ "$status" = "issues" ]; then
            echo "::warning::Missing or broken dependencies for asciinema method (tools are local-only, not expected on CI)"
            if [ -f deps-asciinema.json ] && [ -s deps-asciinema.json ]; then
              jq -r '.tools[] | select(.installed == false or .health == "broken") | "  - \(.name): installed=\(.installed), health=\(.health)"' deps-asciinema.json 2>/dev/null || true
            fi
          fi

      - name: Check missing-tool test method
        id: check-vhs
        continue-on-error: true
        run: |
          # Run dependency check with JSON output
          ./scripts/dependency-manager.sh display_status_json vhs > deps-vhs.json 2>&1 || true

          # Extract status (default to "ok" if file empty or malformed)
          if [ -f deps-vhs.json ] && [ -s deps-vhs.json ]; then
            status=$(jq -r '.status // "unknown"' deps-vhs.json 2>/dev/null || echo "unknown")
          else
            status="unknown"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

          # Display results
          if [ -f deps-vhs.json ] && [ -s deps-vhs.json ]; then
            echo "### VHS Dependencies"
            cat deps-vhs.json | jq '.' || cat deps-vhs.json
          else
            echo "Warning: Could not generate VHS dependency report"
          fi

          # Don't fail on VHS - it's optional
          if [ "$status" = "issues" ]; then
            echo "::warning::Missing or broken dependencies for VHS method (optional)"
          fi

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-reports
          path: |
            deps-*.json
          retention-days: 30

      - name: Dependency check summary
        if: always()
        run: |
          {
            echo "## Dependency Interface Test Results"
            echo ""
            echo "Test-only specification; these are not production demo requirements."
            echo "### available-tool method: ${{ steps.check-asciinema.outputs.status }}"
            echo "### missing-tool method: ${{ steps.check-vhs.outputs.status }}"
            echo ""
            echo "**Report**: Dependency reports uploaded as artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
