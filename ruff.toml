# Lint rules for `ruff check` (run by the check:lint validator).
# Pinned to the classic default set so results do not change when ruff changes its defaults.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# tests and scripts bootstrap sys.path before importing project modules
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
